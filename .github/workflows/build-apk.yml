name: Android APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Inject Gradle Wrapper Scripts
      # Sunucuda komut çalıştırmak yerine gradlew dosyalarını doğrudan metin olarak oluşturuyoruz
      run: |
        cat << 'EOF' > gradlew
        #!/bin/sh
        exec gradle "$@"
        EOF
        
        cat << 'EOF' > gradlew.bat
        @rem Injected Wrapper
        gradle %*
        EOF

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
