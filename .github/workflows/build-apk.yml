name: Android APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Kalıcı +1 Sürüm Artır ve Kaydet
      run: |
        FILE=$([ -f app/build.gradle.kts ] && echo "app/build.gradle.kts" || echo "app/build.gradle")
        
        # 1. versionCode değerini +1 artırır
        CURRENT_CODE=$(grep -oE 'versionCode[ =]+[0-9]+' "$FILE" | grep -oE '[0-9]+' | head -n 1)
        NEW_CODE=$((CURRENT_CODE + 1))
        sed -i -E "s/(versionCode[ =]+)[0-9]+/\1$NEW_CODE/" "$FILE"
        
        # 2. versionName son hanesini +1 artırır (2.10 -> 2.11 -> 2.12)
        CURRENT_NAME=$(grep -oE 'versionName[ =]+"[^"]+"' "$FILE" | sed -E 's/.*"([^"]+)".*/\1/' | head -n 1)
        PREFIX=$(echo "$CURRENT_NAME" | sed -E 's/[0-9]+$//')
        LAST_NUM=$(echo "$CURRENT_NAME" | grep -oE '[0-9]+$')
        NEW_LAST=$((LAST_NUM + 1))
        NEW_NAME="${PREFIX}${NEW_LAST}"
        sed -i -E "s/(versionName[ =]+\")[^\"]+\"/\1$NEW_NAME\"/" "$FILE"
        
        # 3. Yeni sürümü depoya kalıcı olarak kaydeder
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add "$FILE"
        git commit -m "Sürüm otomatik artırıldı: $NEW_NAME [skip ci]"
        git push

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Create Safe Init Script
      # RepositoriesMode engeline takılmamak için depoları settings düzeyinde enjekte ediyoruz
      run: |
        cat << 'EOF' > init.gradle
        settingsEvaluated { settings ->
            settings.pluginManagement {
                repositories {
                    google()
                    mavenCentral()
                }
            }
            settings.dependencyResolutionManagement {
                repositories {
                    google()
                    mavenCentral()
                }
            }
        }
        
        allprojects {
            buildscript {
                repositories {
                    google()
                    mavenCentral()
                }
                dependencies {
                    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22")
                    classpath("com.android.tools.build:gradle:8.2.2")
                }
            }
        }
        EOF

    - name: Build Release APK with Gradle
      run: |
        gradle assembleRelease \
          -Pandroid.useAndroidX=true \
          -Dgradle.user.home=.gradle \
          --init-script init.gradle \
          --no-daemon

    - name: Sign Release APK
      run: |
        echo "${{ secrets.SIGNING_KEY }}" | base64 -di > release-key.jks
        BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
        $BUILD_TOOLS/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
        $BUILD_TOOLS/apksigner sign \
          --ks release-key.jks \
          --ks-key-alias "${{ secrets.ALIAS }}" \
          --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
          --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
          --out app-release-signed.apk \
          app-release-aligned.apk
        
    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: app-release-signed.apk
