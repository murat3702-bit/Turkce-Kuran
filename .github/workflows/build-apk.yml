name: Android APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-clean:
    name: Build Signed APK and Clean Old Releases
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      if: github.event_name != 'schedule'
      uses: actions/checkout@v5
      with:
        persist-credentials: true

    - name: Sürüm Numarasını Hesapla ve Güncelle
      id: version
      if: github.event_name != 'schedule' && github.event_name != 'pull_request'
      run: |
        CURRENT_CODE=$(grep -oE 'versionCode[ =]+[0-9]+' app/build.gradle | grep -oE '[0-9]+' | head -n 1)
        NEW_CODE=$((CURRENT_CODE + 1))
        sed -i -E "s/(versionCode[ =]+)[0-9]+/\1$NEW_CODE/" app/build.gradle

        CURRENT_NAME=$(grep -oE "versionName[ =]+['\"][^'\"]+['\"]" app/build.gradle | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/" | head -n 1)
        PREFIX=$(echo "$CURRENT_NAME" | sed -E 's/[0-9]+$//')
        LAST_NUM=$(echo "$CURRENT_NAME" | grep -oE '[0-9]+$')
        NEW_LAST=$((10#$LAST_NUM + 1))
        NEW_NAME="${PREFIX}${NEW_LAST}"
        sed -i -E "s/(versionName[ =]+['\"])[^'\"]+(['\"])/\1$NEW_NAME\2/" app/build.gradle

        echo "Yeni Sürüm -> versionCode: $NEW_CODE | versionName: $NEW_NAME"
        echo "new_name=$NEW_NAME" >> $GITHUB_OUTPUT

    - name: Set up JDK 17
      if: github.event_name != 'schedule'
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      if: github.event_name != 'schedule'
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-disabled: true

    - name: Create Safe Init Script
      if: github.event_name != 'schedule'
      run: |
        cat << 'EOF' > init.gradle
        settingsEvaluated { settings ->
            settings.pluginManagement {
                repositories {
                    google()
                    mavenCentral()
                }
            }
            settings.dependencyResolutionManagement {
                repositories {
                    google()
                    mavenCentral()
                }
            }
        }
        allprojects {
            buildscript {
                repositories {
                    google()
                    mavenCentral()
                }
                dependencies {
                    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22")
                    classpath("com.android.tools.build:gradle:8.2.2")
                }
            }
        }
        EOF

    - name: Build Release APK with Gradle
      if: github.event_name != 'schedule'
      run: |
        gradle assembleRelease \
          -Pandroid.useAndroidX=true \
          -Dgradle.user.home=.gradle \
          --init-script init.gradle \
          --no-daemon \
          --no-build-cache

    - name: Sign Release APK
      if: github.event_name != 'schedule' && github.event_name != 'pull_request'
      run: |
        echo "${{ secrets.SIGNING_KEY }}" | base64 -di > release-key.jks
        BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
        $BUILD_TOOLS/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
        $BUILD_TOOLS/apksigner sign \
          --ks release-key.jks \
          --ks-key-alias "${{ secrets.ALIAS }}" \
          --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
          --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
          --out "Turkce-Kuran-v${{ steps.version.outputs.new_name }}.apk" \
          app-release-aligned.apk

    - name: Yeni Sürümü Depoya Kaydet (Commit & Push)
      id: git_push
      if: github.event_name != 'schedule' && github.event_name != 'pull_request'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add app/build.gradle
        git commit -m "Sürüm otomatik artırıldı: ${{ steps.version.outputs.new_name }} [skip ci]"
        git push
        echo "new_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Release Signed APK
      if: github.event_name != 'schedule' && github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.new_name }}
        target_commitish: ${{ steps.git_push.outputs.new_sha }}
        name: Turkce Kuran v${{ steps.version.outputs.new_name }}
        files: Turkce-Kuran-v${{ steps.version.outputs.new_name }}.apk
        make_latest: true

    - name: 24 Saatten Eski Sürümleri, Tag'leri ve Önbellekleri Temizle
      if: always() && github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        CUTOFF=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
        LATEST_TAG=$(gh release view --repo "${{ github.repository }}" --json tagName --jq '.tagName' 2>/dev/null || echo "")
        echo "Kesim tarihi (UTC): $CUTOFF"
        echo "Korunan en güncel sürüm: $LATEST_TAG"

        gh cache list --repo "${{ github.repository }}" --limit 100 --json id --jq '.[].id' | while read -r CACHE_ID; do
          if [ -n "$CACHE_ID" ]; then
            gh cache delete "$CACHE_ID" --repo "${{ github.repository }}"
          fi
        done

        gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,createdAt \
          --jq ".[] | select(.createdAt < \"$CUTOFF\") | .tagName" | while read -r TAG; do
            if [ -n "$TAG" ] && [ "$TAG" != "$LATEST_TAG" ]; then
              echo "Siliniyor: $TAG"
              gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag
            fi
          done
