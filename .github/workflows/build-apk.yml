name: Android APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install dependencies
      # BURAYI DEĞİŞTİRİN: alt_klasor_adi yerine kendi klasörünüzün adını yazın
      working-directory: alt_klasor_adi 
      run: flutter pub get

    - name: Build APK
      # BURAYI DEĞİŞTİRİN: alt_klasor_adi yerine kendi klasörünüzün adını yazın
      working-directory: alt_klasor_adi 
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        # BURAYI DEĞİŞTİRİN: alt_klasor_adi kısmını kendi klasörünüzle güncelleyin
        path: alt_klasor_adi/build/app/outputs/flutter-apk/app-release.apk
