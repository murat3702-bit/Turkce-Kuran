name: Android APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Her gün gece 03:00'te (UTC / Türkiye saati 06:00) 24 saati geçmiş sürümleri kontrol edip siler
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-clean:
    name: Build Signed APK and Clean Old Releases
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      if: github.event_name != 'schedule'
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Kalıcı +1 Sürüm Artır ve Kaydet
      id: version
      if: github.event_name != 'schedule' && github.event_name != 'pull_request'
      run: |
        # 1. versionCode değerini +1 artırır
        CURRENT_CODE=$(grep -oE 'versionCode[ =]+[0-9]+' app/build.gradle | grep -oE '[0-9]+' | head -n 1)
        NEW_CODE=$((CURRENT_CODE + 1))
        sed -i -E "s/(versionCode[ =]+)[0-9]+/\1$NEW_CODE/" app/build.gradle

        # 2. versionName son hanesini +1 artırır (2.10 -> 2.11 -> 2.12)
        CURRENT_NAME=$(grep -oE "versionName[ =]+['\"][^'\"]+['\"]" app/build.gradle | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/" | head -n 1)
        PREFIX=$(echo "$CURRENT_NAME" | sed -E 's/[0-9]+$//')
        LAST_NUM=$(echo "$CURRENT_NAME" | grep -oE '[0-9]+$')
        NEW_LAST=$((LAST_NUM + 1))
        NEW_NAME="${PREFIX}${NEW_LAST}"
        sed -i -E "s/(versionName[ =]+['\"])[^'\"]+(['\"])/\1$NEW_NAME\2/" app/build.gradle

        echo "Yeni Sürüm -> versionCode: $NEW_CODE | versionName: $NEW_NAME"
        echo "new_name=$NEW_NAME" >> $GITHUB_OUTPUT

        # 3. Yeni sürümü depoya kalıcı olarak kaydeder
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add app/build.gradle
        git commit -m "Sürüm otomatik artırıldı: $NEW_NAME [skip ci]"
        git push

    - name: Set up JDK 17
      if: github.event_name != 'schedule'
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      if: github.event_name != 'schedule'
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-disabled: true

    - name: Create Safe Init Script
      if: github.event_name != 'schedule'
      # RepositoriesMode engeline takılmamak için depoları settings düzeyinde enjekte ediyoruz
      run: |
        cat << 'EOF' > init.gradle
        settingsEvaluated { settings ->
            settings.pluginManagement {
                repositories {
                    google()
                    mavenCentral()
                }
            }
            settings.dependencyResolutionManagement {
                repositories {
                    google()
                    mavenCentral()
                }
            }
        }
        
        allprojects {
            buildscript {
                repositories {
                    google()
                    mavenCentral()
                }
                dependencies {
                    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22")
                    classpath("com.android.tools.build:gradle:8.2.2")
                }
            }
        }
        EOF

    - name: Build Release APK with Gradle
      if: github.event_name != 'schedule'
      run: |
        gradle assembleRelease \
          -Pandroid.useAndroidX=true \
          -Dgradle.user.home=.gradle \
          --init-script init.gradle \
          --no-daemon \
          --no-build-cache

    - name: Sign Release APK
      if: github.event_name != 'schedule'
      run: |
        echo "${{ secrets.SIGNING_KEY }}" | base64 -di > release-key.jks
        BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
        $BUILD_TOOLS/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
        $BUILD_TOOLS/apksigner sign \
          --ks release-key.jks \
          --ks-key-alias "${{ secrets.ALIAS }}" \
          --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
          --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
          --out app-v${{ steps.version.outputs.new_name }}-release-signed.apk \
          app-release-aligned.apk

    - name: Release Signed APK
      if: github.event_name != 'schedule' && github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.new_name }}
        name: Release v${{ steps.version.outputs.new_name }}
        files: app-v${{ steps.version.outputs.new_name }}-release-signed.apk

    - name: 24 Saatten Eski Sürümleri ve Tag'leri Temizle
      if: always() && github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        CUTOFF=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
        echo "Kesim tarihi (UTC): $CUTOFF"

        gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,createdAt \
          --jq ".[] | select(.createdAt < \"$CUTOFF\") | .tagName" | while read -r TAG; do
            if [ -n "$TAG" ]; then
              echo "Siliniyor: $TAG"
              gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag
            fi
          done
