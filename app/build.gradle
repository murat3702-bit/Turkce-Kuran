plugins { id 'com.android.application' }
android {
    namespace 'com.mb.turkcekuran.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.mb.turkcekuran.app'
        minSdk 24
        targetSdk 34
        // Her değişiklikte SADECE bu sayıyı +1 artırın; versionName ve
        // Hakkında ekranındaki "Ver N" yazısı otomatik güncellenir.
        def appVersion = 10
        versionCode appVersion
        versionName "${appVersion}"
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress 'html' }
}
